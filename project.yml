# TransportCat — XcodeGen project spec.
#
# The .xcodeproj is generated, never committed: run `xcodegen generate` before
# building (CI does this on the macos-26 runner).
#
# Identity: bundle id `cat.transport.app`, display name `TransportCat`,
# scheme `TransportCat`.

name: TransportCat

options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: ca
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # Temporary for the redesign branch: report every compile error of a target
    # in one CI run instead of stopping at the first failing file. Remove
    # before merging (redesign-v2 T7).
    OTHER_SWIFT_FLAGS: "$(inherited) -continue-building-after-errors"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # DEVELOPMENT_TEAM is unset on purpose: simulator builds need no team; the
    # signed CI archive injects it on the command line.
    # TMB public API credentials are injected at build time (CI secrets or a
    # local override); they are never committed with real values.
    TMB_APP_ID: ""
    TMB_APP_KEY: ""
    # Sentry DSN injected at build time; empty means crash reporting is off.
    SENTRY_DSN: ""

packages:
  # sentry-cocoa: crash reporting and handled errors. Major version pinned.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"

targets:
  TransportCat:
    type: application
    platform: iOS
    sources:
      - path: TransportCat
        excludes:
          # Provided through INFOPLIST_FILE below; must not be copied into the
          # bundle as a resource.
          - Resources/Info.plist
    dependencies:
      - package: Sentry
        product: Sentry
      # Spec S20: the widget extension and the Live Activity ship inside the
      # app bundle.
      - target: TransportCatWidgets
        embed: true
      # Spec S22: the watch app is embedded too; XcodeGen puts a watchOS
      # application dependency in "Embed Watch Content".
      - target: TransportCatWatch
        embed: true
    settings:
      base:
        PRODUCT_NAME: TransportCat
        PRODUCT_BUNDLE_IDENTIFIER: cat.transport.app
        INFOPLIST_FILE: TransportCat/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signing is resolved per target on purpose: the signed CI archive
        # overrides only these TRANSPORTCAT_* variables on the xcodebuild
        # command line; locally they keep the automatic-signing defaults.
        TRANSPORTCAT_CODE_SIGN_STYLE: Automatic
        TRANSPORTCAT_CODE_SIGN_IDENTITY: Apple Development
        TRANSPORTCAT_PROFILE_SPECIFIER: ""
        CODE_SIGN_STYLE: $(TRANSPORTCAT_CODE_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(TRANSPORTCAT_CODE_SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(TRANSPORTCAT_PROFILE_SPECIFIER)

  # Spec S20: widgets + Live Activity. An app extension embedded in
  # `TransportCat`, with its own bundle id and its own App Store profile.
  # The source set is explicit: the extension folder plus only the shared
  # files the App Intents, the arrivals fetcher and the widget need. Core
  # files that pull in Sentry, `Features/` types, UserNotifications,
  # BackgroundTasks or `UIApplication` stay out.
  TransportCatWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TransportCatWidgets
        excludes:
          - Info.plist
      # Spec S15 App Intents, compiled unchanged by the extension.
      - path: TransportCat/Intents
      # Live Activity attributes shared by both targets (the controller is
      # app-only and is not listed).
      - path: TransportCat/Core/LiveActivity/ArrivalActivityAttributes.swift
      # Core closure of the Intents + widget (imports and type references).
      - path: TransportCat/Core/TMB/JSONValue.swift
      - path: TransportCat/Core/TMB/TMBClient.swift
      - path: TransportCat/Core/TMB/TMBClient+Bus.swift
      - path: TransportCat/Core/TMB/TMBClient+Places.swift
      - path: TransportCat/Core/TMB/TMBCredentials.swift
      - path: TransportCat/Core/TMB/TMBError.swift
      - path: TransportCat/Core/TMB/TMBParsers.swift
      - path: TransportCat/Core/TMB/TMBPlaceParsers.swift
      - path: TransportCat/Core/Bus/BusModels.swift
      - path: TransportCat/Core/Bus/BusParsers.swift
      - path: TransportCat/Core/FGC/FGCClient.swift
      - path: TransportCat/Core/FGC/FGCModels.swift
      - path: TransportCat/Core/FGC/FGCParsers.swift
      - path: TransportCat/Core/Models/Arrival.swift
      - path: TransportCat/Core/Models/LineGeometry.swift
      - path: TransportCat/Core/Models/MetroLine.swift
      - path: TransportCat/Core/Models/ServiceAlert.swift
      - path: TransportCat/Core/Models/Station.swift
      - path: TransportCat/Core/Cache/DiskCache.swift
      - path: TransportCat/Core/Engine/GeoMath.swift
      - path: TransportCat/Core/Places/GeoPoint+Place.swift
      - path: TransportCat/Core/Places/Place.swift
      - path: TransportCat/Core/Places/PlaceCatalogStore.swift
      - path: TransportCat/Core/Places/PlaceIndex.swift
      - path: TransportCat/Core/Favorites/FavoritesStore.swift
      - path: TransportCat/Core/ColorFromHex.swift
      - path: TransportCat/Core/HexLuminance.swift
    settings:
      base:
        PRODUCT_NAME: TransportCatWidgets
        PRODUCT_BUNDLE_IDENTIFIER: cat.transport.app.widgets
        INFOPLIST_FILE: TransportCatWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        # The extension shares the app's certificate; only the profile is its
        # own (CI passes TRANSPORTCAT_WIDGETS_PROFILE_SPECIFIER on the archive
        # command line, as it does for the app target).
        TRANSPORTCAT_WIDGETS_CODE_SIGN_STYLE: Automatic
        TRANSPORTCAT_WIDGETS_CODE_SIGN_IDENTITY: Apple Development
        TRANSPORTCAT_WIDGETS_PROFILE_SPECIFIER: ""
        CODE_SIGN_STYLE: $(TRANSPORTCAT_CODE_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(TRANSPORTCAT_CODE_SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(TRANSPORTCAT_WIDGETS_PROFILE_SPECIFIER)
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG WIDGET_EXTENSION
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXTENSION

  # Spec S22: Apple Watch app. A single-target watchOS 10 application (no
  # WatchKit extension), embedded in `TransportCat`. Like the widget
  # extension, its source set is explicit: only the watch folder plus the
  # shared Core files proven extension-safe by the widgets target, minus the
  # Live Activity attributes it does not use. No Sentry, no App Group.
  TransportCatWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: TransportCatWatch
        excludes:
          - Info.plist
      # The S15 arrivals fetcher (the only Intents file the watch compiles:
      # AppIntents is not used on the wrist).
      - path: TransportCat/Intents/NextArrivalsFetcher.swift
      # Core closure of the fetcher, the place search and the local cache.
      - path: TransportCat/Core/TMB/JSONValue.swift
      - path: TransportCat/Core/TMB/TMBClient.swift
      - path: TransportCat/Core/TMB/TMBClient+Bus.swift
      - path: TransportCat/Core/TMB/TMBClient+Places.swift
      - path: TransportCat/Core/TMB/TMBCredentials.swift
      - path: TransportCat/Core/TMB/TMBError.swift
      - path: TransportCat/Core/TMB/TMBParsers.swift
      - path: TransportCat/Core/TMB/TMBPlaceParsers.swift
      - path: TransportCat/Core/Bus/BusModels.swift
      - path: TransportCat/Core/Bus/BusParsers.swift
      - path: TransportCat/Core/FGC/FGCClient.swift
      - path: TransportCat/Core/FGC/FGCModels.swift
      - path: TransportCat/Core/FGC/FGCParsers.swift
      - path: TransportCat/Core/Models/Arrival.swift
      - path: TransportCat/Core/Models/LineGeometry.swift
      - path: TransportCat/Core/Models/MetroLine.swift
      - path: TransportCat/Core/Models/ServiceAlert.swift
      - path: TransportCat/Core/Models/Station.swift
      - path: TransportCat/Core/Cache/DiskCache.swift
      - path: TransportCat/Core/Engine/GeoMath.swift
      - path: TransportCat/Core/Places/GeoPoint+Place.swift
      - path: TransportCat/Core/Places/Place.swift
      - path: TransportCat/Core/Places/PlaceCatalogStore.swift
      - path: TransportCat/Core/Places/PlaceIndex.swift
    settings:
      base:
        PRODUCT_NAME: TransportCatWatch
        PRODUCT_BUNDLE_IDENTIFIER: cat.transport.app.watchkitapp
        INFOPLIST_FILE: TransportCatWatch/Info.plist
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The watch app shares the app's certificate; only the profile is its
        # own (CI passes TRANSPORTCAT_WATCH_PROFILE_SPECIFIER on the archive
        # command line, as it does for the app).
        TRANSPORTCAT_WATCH_PROFILE_SPECIFIER: ""
        CODE_SIGN_STYLE: $(TRANSPORTCAT_CODE_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(TRANSPORTCAT_CODE_SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(TRANSPORTCAT_WATCH_PROFILE_SPECIFIER)

  TransportCatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        # The test bundle needs no custom plist; let the build generate it.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TransportCat

schemes:
  TransportCat:
    build:
      targets:
        TransportCat: all
        TransportCatTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TransportCatTests
