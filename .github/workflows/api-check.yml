# One-shot diagnostic: probes TMB public API endpoint variants with the
# credentials stored in the `release` environment. Manual dispatch only;
# prints HTTP status, byte counts and a small sample of each response —
# never a credential (GitHub masks them anyway).

name: TMB API check

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Probe TMB endpoints
        env:
          TMB_APP_ID: ${{ secrets.TMB_APP_ID }}
          TMB_APP_KEY: ${{ secrets.TMB_APP_KEY }}
        run: |
          set -uo pipefail
          probe() {
            local label="$1"; shift
            local path="$1"; shift
            local code bytes sep
            # Paths may carry their own query (i-Metro `estacions`), so append
            # the credentials with `&` when a `?` is already present.
            sep='?'
            case "$path" in
              *\?*) sep='&' ;;
            esac
            code="$(curl -s -o /tmp/out.json -w '%{http_code}' "https://api.tmb.cat/v1/$path${sep}app_id=$TMB_APP_ID&app_key=$TMB_APP_KEY")"
            bytes="$(wc -c < /tmp/out.json | tr -d ' ')"
            echo "== $label [$path] -> HTTP $code ($bytes bytes)"
            if [ "$code" = "200" ]; then
              head -c 200 /tmp/out.json | tr -d '\n'; echo
            fi
          }
          # Line geometry, stations and route records (L1)
          probe linia-1 "transit/linies/metro/1"
          jq -c '{features: (.features | length), geometry: [.features[].geometry.type]}' /tmp/out.json || true
          probe linia-1-filter "transit/linies/metro?filter=CODI_LINIA=1"
          jq -c '{features: (.features | length), geometry: [.features[].geometry.type]}' /tmp/out.json || true
          probe estacions-1 "transit/linies/metro/1/estacions"
          codes="$(jq -r '[.features[].properties.CODI_ESTACIO] | join(",")' /tmp/out.json || true)"
          echo "L1 station codes: $codes"
          probe recs-1 "transit/linies/metro/1/recs"
          # i-Metro live arrivals: two L1 stations, then the whole line in one request
          probe imetro-l1 "itransit/metro/estacions?estacions=111,112"
          probe imetro-l1-all "itransit/metro/estacions?estacions=$codes"
          jq -c '[.linies[] | {codi_linia, nom_linia, estacions: [.estacions[].codi_estacio] | unique | length}]' /tmp/out.json || true
          # Service alerts baseline
          probe alerts "alerts/metro/channels/WEB"
