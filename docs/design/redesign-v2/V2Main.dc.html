<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"startMode":{"editor":"enum","options":["metro","bus","fgc","tot"],"default":"metro"},"status":{"editor":"enum","options":["live","stale","offline"],"default":"live"},"startMenu":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: null, menu: null, ops: { metro: true, bus: false, fgc: true } };
  }
  renderVals() {
    const dark = (this.props.theme ?? 'dark') !== 'light';
    const c = dark ? {
      land: '#1c1e22', street: '#26292e', avenue: '#30343a', park: '#1d2a21', water: '#0d2230',
      glass: 'rgba(44,46,52,0.55)', menuBg: 'rgba(40,42,48,0.80)', glassEdge: 'rgba(255,255,255,0.16)',
      glassShadow: 'inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 30px rgba(0,0,0,0.45)',
      text: '#ffffff', sub: 'rgba(235,235,245,0.75)', inner: 'rgba(255,255,255,0.13)',
      pillOn: 'rgba(255,255,255,0.92)', pillOnText: '#111114', accent: '#409CFF',
      tabSel: 'rgba(255,255,255,0.14)', scrim: 'rgba(0,0,0,0.30)', rowSel: 'rgba(255,255,255,0.12)',
      edgeFade: 'linear-gradient(to bottom, rgba(0,0,0,0.45), rgba(0,0,0,0))'
    } : {
      land: '#f3f1ec', street: '#e4e0d8', avenue: '#ffffff', park: '#d5e7cc', water: '#aacfe6',
      glass: 'rgba(255,255,255,0.62)', menuBg: 'rgba(255,255,255,0.85)', glassEdge: 'rgba(255,255,255,0.85)',
      glassShadow: 'inset 0 1px 0 rgba(255,255,255,0.9), 0 10px 30px rgba(0,0,0,0.14)',
      text: '#111114', sub: 'rgba(60,60,67,0.85)', inner: 'rgba(0,0,0,0.06)',
      pillOn: '#111114', pillOnText: '#ffffff', accent: '#0066D6',
      tabSel: 'rgba(0,0,0,0.06)', scrim: 'rgba(0,0,0,0.12)', rowSel: 'rgba(0,0,0,0.06)',
      edgeFade: 'linear-gradient(to bottom, rgba(255,255,255,0.6), rgba(255,255,255,0))'
    };
    const mode = this.state.mode ?? this.props.startMode ?? 'metro';
    const menuOpen = this.state.menu ?? this.props.startMenu ?? false;
    const ops = this.state.ops;
    const tot = mode === 'tot';
    const show = (on) => (on ? '1' : '0');
    const labels = { metro: 'Metro', bus: 'Bus', fgc: 'FGC', tot: 'Tot' };
    const modes = [
      ['metro', '#E3242B', 'L1'], ['bus', '#1F5BEF', 'H12'], ['fgc', '#F39200', 'S1'], ['tot', dark ? '#ffffff' : '#111114', 'Xarxa']
    ].map(([id, color, hint]) => ({
      label: labels[id], color, hint,
      on: id === mode,
      bg: id === mode ? c.rowSel : 'transparent',
      pick: () => this.setState({ mode: id, menu: false })
    }));
    const opColors = { metro: '#E3242B', bus: '#1F5BEF', fgc: '#F39200' };
    const toggles = ['metro', 'bus', 'fgc'].map((id) => ({
      label: labels[id],
      on: ops[id],
      dot: ops[id] ? opColors[id] : 'transparent',
      ring: opColors[id],
      bg: ops[id] ? c.pillOn : 'transparent',
      color: ops[id] ? c.pillOnText : c.sub,
      pick: () => this.setState({ ops: { ...ops, [id]: !ops[id] } })
    }));
    const statusKind = this.props.status ?? 'live';
    const status = {
      live: { label: 'En directe', detail: 'fa 8 s', dot: '#30D158', hasDot: true, isOffline: false },
      stale: { label: 'Retard', detail: 'fa 2 min', dot: '#FF9F0A', hasDot: true, isOffline: false },
      offline: { label: 'Sense connexió', detail: 'horari previst', dot: 'transparent', hasDot: false, isOffline: true }
    }[statusKind];
    return {
      c, modes, toggles, status, menuOpen,
      modeLabel: labels[mode],
      toggleMenu: () => this.setState({ menu: !menuOpen }),
      closeMenu: () => this.setState({ menu: false }),
      isMetro: mode === 'metro', isBus: mode === 'bus', isFgc: mode === 'fgc', isTot: tot,
      showIncident: mode === 'metro' || (tot && ops.metro),
      op: {
        l1: show(mode === 'metro' || (tot && ops.metro)),
        otherMetro: show(tot && ops.metro),
        s1: show(mode === 'fgc' || (tot && ops.fgc)),
        s2: show(tot && ops.fgc),
        bus: show(mode === 'bus' || (tot && ops.bus)),
        l1Stations: show(mode === 'metro'),
        s1Stations: show(mode === 'fgc'),
        busStops: show(mode === 'bus')
      }
    };
  }
}
</script>
</body>
</html>
