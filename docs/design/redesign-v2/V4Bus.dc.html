<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Parades — Bus V1</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Inter, system-ui, sans-serif; background: #0f1012; color: #ffffff">

<div role="status" style="position: absolute; top: 58px; left: 16px; height: 36px; padding: 0 12px; box-sizing: border-box; display: flex; align-items: center; gap: 7px; border-radius: 18px; font-size: 13px; font-weight: 600; background: rgba(44,46,52,0.70); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%)">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #30D158"></span>
<span>En directe</span>
<span style="font-weight: 500; color: rgba(235,235,245,0.75)">7 busos</span>
</div>
<button type="button" aria-label="Anar a la parada més propera" style="position: absolute; top: 54px; right: 16px; width: 44px; height: 44px; border-radius: 22px; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #409CFF; background: rgba(44,46,52,0.70); border: 1px solid rgba(255,255,255,0.14); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%)">
<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8-8-2Z"></path></svg>
</button>

<div aria-hidden="true" style="position: absolute; top: 108px; left: 16px; right: 16px; height: 36px; padding: 0 12px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; border-radius: 18px; font-size: 12px; font-weight: 700; color: rgba(235,235,245,0.75); background: rgba(44,46,52,0.70); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%)">
<span>Cap a Av. Esplugues</span>
<span>Pròxims busos</span>
</div>

<ol aria-label="Parades de la V1 cap a Av. Esplugues" style="position: absolute; top: 154px; left: 0; right: 0; margin: 0; padding: 0 16px; list-style: none">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<li style="position: relative; height: 66px; display: flex; align-items: center; border-radius: 16px; background: {{r.bg}}">
<svg width="56" height="66" viewBox="0 0 56 66" aria-hidden="true" style="flex: none">
<path d="M28 0V66" stroke="#6AB023" stroke-width="6" stroke-linecap="round"></path>
<circle cx="28" cy="33" r="7" fill="#ffffff" stroke="#6AB023" stroke-width="3.5" opacity="{{r.stopOp}}"></circle>
<rect x="19" y="23" width="18" height="20" rx="9" fill="#ffffff" stroke="#0f1012" stroke-width="2.5" opacity="{{r.xferOp}}"></rect>
</svg>
<sc-if value="{{r.hasBus}}" hint-placeholder-val="{{ false }}">
<svg width="30" height="30" viewBox="0 0 44 44" aria-hidden="true" style="position: absolute; left: 13px; top: -15px; z-index: 2; overflow: visible; opacity: {{r.busOpacity}}; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6))">
<g transform="rotate(180 22 22)"><path d="M22 2.5 L28 10.5 L16 10.5 Z" fill="#6AB023" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"></path></g>
<circle cx="22" cy="22" r="13" fill="#6AB023" stroke="#ffffff" stroke-width="2.4" stroke-dasharray="{{r.dash}}"></circle>
<g fill="none" stroke="#0b2a00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="14.5" width="12" height="12" rx="2.5"></rect><path d="M16 20H28M18.5 26.5v2.5M25.5 26.5v2.5"></path></g>
</svg>
</sc-if>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding-left: 4px">
<span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<span style="display: flex; align-items: center; gap: 6px; min-width: 0">
<sc-for list="{{r.xfers}}" as="x" hint-placeholder-count="1">
<span style="flex: none; height: 18px; min-width: 24px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; background: {{x.color}}; color: {{x.ink}}">{{x.code}}</span>
</sc-for>
<sc-if value="{{r.me}}" hint-placeholder-val="{{ false }}">
<span style="flex: none; display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #409CFF"><span style="width: 8px; height: 8px; border-radius: 4px; background: #409CFF; box-shadow: 0 0 0 3px rgba(64,156,255,0.3)"></span>Ets aquí · 120 m</span>
</sc-if>
<span style="min-width: 0; font-size: 13px; font-weight: 500; color: rgba(235,235,245,0.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.street}}</span>
</span>
</div>
<span style="flex: none; width: 96px; padding-right: 12px; box-sizing: border-box; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-variant-numeric: tabular-nums">
<span style="font-size: 16px; font-weight: 700; color: {{r.nextColor}}">{{r.next}}</span>
<span style="font-size: 12px; font-weight: 500; color: rgba(235,235,245,0.75)">{{r.after}}</span>
</span>
</li>
</sc-for>
</ol>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 190px; background: linear-gradient(to bottom, rgba(15,16,18,0), rgba(15,16,18,0.92) 45%); pointer-events: none"></div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 96px; height: 54px; padding: 4px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; border-radius: 27px; background: rgba(44,46,52,0.70); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%)">
<button type="button" aria-label="Mode: Bus. Canviar de mode" style="flex: none; height: 46px; padding: 0 10px 0 14px; display: flex; align-items: center; gap: 6px; border: 0; border-radius: 23px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 700; color: #ffffff; background: rgba(255,255,255,0.13)">
Bus
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"></path></svg>
</button>
<button type="button" aria-label="Línia V1, cap a Av. Esplugues. Canviar de línia" style="flex: 1 1 auto; min-width: 0; height: 46px; padding: 0 10px 0 6px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 23px; cursor: pointer; text-align: left; font-family: inherit; font-size: 15px; font-weight: 600; color: #ffffff; background: transparent">
<span style="flex: none; height: 32px; min-width: 36px; padding: 0 8px; box-sizing: border-box; border-radius: 16px; background: #6AB023; color: #0b2a00; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">V1</span>
<span style="flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Cap a Av. Esplugues</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
</button>
<button type="button" aria-label="Invertir la direcció" style="flex: none; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 23px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #ffffff; background: rgba(255,255,255,0.13)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"></path></svg>
</button>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; gap: 10px; align-items: center">
<nav aria-label="Pestanyes" style="flex: 1 1 auto; height: 62px; padding: 4px; box-sizing: border-box; display: flex; gap: 2px; border-radius: 31px; background: rgba(44,46,52,0.70); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%)">
<button type="button" aria-pressed="false" style="flex: 1 1 0; border: 0; border-radius: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 600; color: #ffffff; background: transparent">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2ZM9 4v14M15 6v14"></path></svg>
Mapa
</button>
<button type="button" aria-pressed="true" style="flex: 1 1 0; border: 0; border-radius: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 600; color: #409CFF; background: rgba(255,255,255,0.14)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5v14"></path><circle cx="7" cy="5" r="2.2" fill="currentColor"></circle><circle cx="7" cy="12" r="2.2" fill="currentColor"></circle><circle cx="7" cy="19" r="2.2" fill="currentColor"></circle><path d="M12 5h8M12 12h6M12 19h8"></path></svg>
Parades
</button>
<button type="button" aria-pressed="false" style="flex: 1 1 0; border: 0; border-radius: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 600; color: #ffffff; background: transparent">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3Z"></path><path d="M12 10v4M12 17v.5"></path></svg>
Avisos
</button>
</nav>
<button type="button" aria-label="Cercar" style="flex: none; width: 62px; height: 62px; border-radius: 31px; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #ffffff; background: rgba(44,46,52,0.70); border: 1px solid rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sub = 'rgba(235,235,245,0.75)';
    const X = {
      L9S: { code: 'L9S', color: '#F38B00', ink: '#111114' },
      FGC: { code: 'FGC', color: '#84BD00', ink: '#10220a' }
    };
    const raw = [
      { name: 'Primer de Maig - Botànica', street: 'Primer de Maig, 10', next: '2 min', after: '14 min' },
      { name: 'Botànica - Primer de Maig', street: 'Botànica, 125', next: '3 min', after: '15 min', bus: 'live' },
      { name: 'Botànica - Miguel Hernández', street: 'Botànica, 51-117', next: '5 min', after: '17 min' },
      { name: 'Av. Joan Carles I - Botànica', street: 'Joan Carles I, s/n', next: 'ara', after: '9 min', me: true, bus: 'estimated' },
      { name: 'Av. Joan Carles I - Ciències', street: 'Pl. Europa, 29-31', next: '1 min', after: '10 min' },
      { name: 'Metro/FGC Europa - Fira', street: 'Pl. Europa, 12', next: '3 min', after: '12 min', xfers: [X.L9S, X.FGC] },
      { name: 'Amadeu Torner - Aprestadora', street: 'Amadeu Torner, 58', next: '—', after: 'Sense dada' },
      { name: 'Av. Carrilet - Cooperativa', street: 'Av. Carrilet, 121', next: '6 min', after: '15 min', bus: 'live' }
    ];
    const rows = raw.map((r) => {
      const isXfer = (r.xfers || []).length > 0;
      return {
        ...r,
        xfers: r.xfers || [],
        me: !!r.me,
        bg: r.me ? 'rgba(64,156,255,0.12)' : 'transparent',
        nextColor: r.next === 'ara' ? '#30D158' : r.next === '—' ? sub : '#ffffff',
        stopOp: isXfer ? '0' : '1',
        xferOp: isXfer ? '1' : '0',
        hasBus: !!r.bus,
        dash: r.bus === 'estimated' ? '3 2.6' : 'none',
        busOpacity: r.bus === 'estimated' ? 0.88 : 1
      };
    });
    return { rows };
  }
}
</script>
</body>
</html>
