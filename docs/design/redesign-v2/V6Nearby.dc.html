{{s.walk}}

<span style="min-width: 0; display: flex; flex-direction: column">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() {
    const c = (t) => (t === 'ara' ? '#30D158' : '#ffffff');
    const row = (code, color, ink, dest1, t1, dest2, t2) => ({ code, color, ink, dest1, t1, dest2, t2, t1Color: c(t1), t2Color: c(t2) });
    const stops = [
      { name: 'Mallorca - Sardenya', walk: '1 min', rows: [
        row('H10', '#1F5BEF', '#ffffff', 'Badal', '3 min', 'Olímpica', '7 min'),
        row('V21', '#6AB023', '#0b2a00', 'Pg. Marítim', '5 min', 'Bonanova', '12 min')
      ] },
      { name: 'Sagrada Família', walk: '2 min', rows: [
        row('L2', '#9B2C8F', '#ffffff', 'Badalona P. Fabra', '2 min', 'Paral·lel', '4 min'),
        row('L5', '#0077C8', '#ffffff', 'Vall d’Hebron', 'ara', 'Cornellà Centre', '6 min')
      ] },
      { name: 'Provença (FGC)', walk: '9 min', rows: [
        row('S2', '#84BD00', '#111114', 'Sabadell P. Nord', '4 min', 'Pl. Catalunya', '2 min')
      ] }
    ];
    return { stops };
  }
}
</script>
