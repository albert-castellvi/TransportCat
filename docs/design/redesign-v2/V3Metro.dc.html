<script type="text/x-dc" data-dc-script data-props='{"startSelection":{"editor":"enum","options":["incident","train","none"],"default":"incident"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: null, trainId: 't2' };
  }
  renderVals() {
    const sel = this.state.sel ?? this.props.startSelection ?? 'incident';
    const trains = [
      { id: 't1', x: 70, y: 685, bearing: 225, dest: 'Paral·lel', next: 'Bac de Roda', eta: '1 min' },
      { id: 't2', x: 130, y: 618, bearing: 45, dest: 'Verneda', next: 'La Pau', eta: '2 min' },
      { id: 't3', x: 345, y: 325, bearing: 45, dest: 'Badalona Pompeu Fabra', next: 'Pep Ventura', eta: 'ara' },
      { id: 'c1', x: 372, y: 270, cluster: 3 }
    ];
    const selectedId = sel === 'train' ? this.state.trainId : null;
    const vehicles = trains.map((t) => {
      const isCluster = !!t.cluster;
      const selected = t.id === selectedId;
      return {
        left: t.x - 22,
        top: t.y - 22,
        bearing: t.bearing ?? 0,
        scale: selected ? 1.15 : 1,
        haloOp: selected ? '1' : '0',
        stackOp: isCluster ? '0.6' : '0',
        headingOp: isCluster ? '0' : '1',
        glyphOp: isCluster ? '0' : '1',
        countOp: isCluster ? '1' : '0',
        count: isCluster ? String(t.cluster) : '',
        aria: isCluster ? t.cluster + ' trens de la L2 a Badalona Pompeu Fabra' : 'Tren de la L2 cap a ' + t.dest,
        pick: () => this.setState(isCluster ? { sel: 'none' } : { sel: 'train', trainId: t.id })
      };
    });
    const train = trains.find((t) => t.id === this.state.trainId) ?? trains[1];
    return {
      vehicles,
      isIncident: sel === 'incident',
      isTrain: sel === 'train',
      train,
      trainLabel: {
        show: sel === 'train',
        left: train.x - 30,
        top: train.y + 22,
        text: train.dest
      },
      incidentScale: sel === 'incident' ? 1.1 : 1,
      attributionOp: sel === 'none' ? 1 : 0,
      openIncident: () => this.setState({ sel: 'incident' }),
      close: () => this.setState({ sel: 'none' })
    };
  }
}
</script>
